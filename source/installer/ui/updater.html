<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Witchspire Co-op Mod Update</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="updater.css" />
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <img class="logo" src="logo-client.png" alt="" data-tauri-drag-region />
    <span class="name" data-tauri-drag-region>Co-op Mod Update</span>
    <div class="drag" data-tauri-drag-region></div>
    <button class="winbtn close" id="wClose" title="Close">&#x2715;</button>
  </div>
  <main class="frame upd"><i class="c3"></i><i class="c4"></i>
    <h2 id="uTitle">Checking for updates</h2>
    <p id="uText" class="muted"></p>
    <div class="bar busy" id="uBar"><div></div></div>
    <div class="log" id="log" style="display:none"></div>
    <div class="btns" id="uBtns"></div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="updater.js"></script>
</body>
</html>
