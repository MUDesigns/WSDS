[package]
name = "wscoop-installer"
version = "0.0.52"
edition = "2021"

[features]
default = []
server = []
client = []
# Small player-side updater (WSCoopUpdater.exe): no payload, started by the game via wscoop-update://
updater = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
